[project]
name = "whisper-si"
version = "0.1.0"
description = "Whisper-tiny ASR accelerator: numpy int golden model, weight generators, e2e Verilator harness"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.4",
    "openai-whisper>=20240930",
    "transformers>=4.44",
    "soundfile>=0.12",
    "jiwer>=3.0",
    "pytest>=8",
    "tqdm",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["golden/tests", "tests"]
